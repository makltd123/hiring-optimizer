version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: hiring_optimizer
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build: ./backend
    environment:
      DEPLOYMENT_MODE: enterprise
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@postgres/hiring_optimizer
      LOCAL_LLM_URL: http://ollama:11434
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b}
      JWT_SECRET: ${JWT_SECRET}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_SERVER: ${LDAP_SERVER:-""}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-""}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-""}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-""}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - ollama
    restart: unless-stopped

  celery_worker:
    build: ./backend
    command: celery -A services.task_queue.celery_app worker --loglevel=info --concurrency=4
    environment:
      DEPLOYMENT_MODE: enterprise
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@postgres/hiring_optimizer
      LOCAL_LLM_URL: http://ollama:11434
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - redis
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
